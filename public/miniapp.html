<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0712"><title>Miumeoshop Mini App</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="miniapp.css"></head><body><div class="bg"></div><main class="app"><header class="hero"><div><div class="eyebrow">MIUMEO • MINI APP</div><h1>Quản lý shop <span>⚡</span></h1><p id="adminName">Đang kết nối Telegram…</p></div><button id="refresh" class="glassbtn">↻</button></header><section id="stats" class="stats"></section><nav class="tabs"><button class="active" data-tab="products">📦 Sản phẩm</button><button data-tab="ctvs">👥 CTV</button><button data-tab="orders">🧾 Đơn</button></nav><section id="products" class="panel"></section><section id="ctvs" class="panel hidden"></section><section id="orders" class="panel hidden"></section></main><button id="fab">＋</button><div id="modal" class="modal hidden"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">Thêm sản phẩm</h2><button id="close">×</button></div><label>Tên sản phẩm<input id="name" placeholder="Áo baby tee"></label><label>Giá CTV<input id="price" type="number" inputmode="numeric" placeholder="129000"></label><label>Danh mục<select id="category"><option value="nu">🎀 Đồ nữ</option><option value="nam">🖤 Đồ nam</option><option value="unisex">🤍 Unisex</option></select></label><label>Ảnh sản phẩm<div class="upload"><input id="imageFile" type="file" accept="image/*"><span>📷 Chọn ảnh từ thư viện</span></div></label><img id="preview" class="preview hidden"><input id="editId" type="hidden"><button id="save" class="primary">✨ Lưu sản phẩm</button></div></div><div id="toast" class="toast"></div><script src="miniapp.js"></script></body></html>
